<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VibeGrid - Unique Splash</title>
<style>
  :root{
    /* App Colors */
    --sidebar-color:#2A2C3E; /* HEX: 42, 44, 62 */
    --page-color:#252739;    /* HEX: 37, 39, 57 */
    --edge-color:#1a1b29;    /* Slightly darker for edges */
    
    --white:#ffffff;
    --accent:#7c5cff;
    --accent-glow:rgba(124,92,255,0.25); /* Dimmed glow */
    --dim:rgba(255,255,255,0.42);
    --ring-r:155;
    --circ:calc(2 * 3.14159265 * var(--ring-r));
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--page-color);
    overflow:hidden;
  }

  .splash{
    position:relative;
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    /* Blending your sidebar and page colors */
    background: radial-gradient(circle at 50% 42%, var(--sidebar-color) 0%, var(--page-color) 60%, var(--edge-color) 100%);
    font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  /* Ambient glow behind the mark (Dimmed) */
  .ambient-glow{
    position:absolute;
    top:50%; left:50%;
    width:min(70vmin, 520px); height:min(70vmin, 520px);
    transform:translate(-50%,-50%) scale(0.8);
    background:radial-gradient(circle, var(--accent-glow) 0%, rgba(124,92,255,0) 68%);
    opacity:0;
    filter:blur(12px);
    animation: glowBloom 2.6s ease-out 1.9s forwards, glowBreathe 3.4s ease-in-out 4.5s infinite;
    pointer-events:none;
  }

  .icon-stage{
    width:min(46vmin, 260px);
    height:min(46vmin, 260px);
    position:relative;
  }

  .icon-svg{ width:100%; height:100%; overflow:visible; }

  /* Glassmorphism Cards */
  .card{
    opacity:0;
    fill:url(#glassGrad);
    stroke:rgba(255,255,255,0.9);
    stroke-width:2;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4)); /* Darker shadow to pop on new bg */
    transform-box:fill-box;
    transform-origin:center;
  }
  
  .card-tl{ animation:flyTL 0.85s cubic-bezier(.2,.7,.2,1) 0.15s forwards; }
  .card-tr{ animation:flyTR 0.85s cubic-bezier(.2,.7,.2,1) 0.32s forwards; }
  .card-bl{ animation:flyBL 0.85s cubic-bezier(.2,.7,.2,1) 0.49s forwards; }
  .card-br{ animation:flyBR 0.85s cubic-bezier(.2,.7,.2,1) 0.66s forwards; }

  @keyframes flyTL{ from{ transform:translate(-70vw,-70vh) rotate(-30deg); opacity:0; } to{ transform:translate(0,0) rotate(0); opacity:1; } }
  @keyframes flyTR{ from{ transform:translate(70vw,-70vh) rotate(30deg); opacity:0; } to{ transform:translate(0,0) rotate(0); opacity:1; } }
  @keyframes flyBL{ from{ transform:translate(-70vw,70vh) rotate(30deg); opacity:0; } to{ transform:translate(0,0) rotate(0); opacity:1; } }
  @keyframes flyBR{ from{ transform:translate(70vw,70vh) rotate(-30deg); opacity:0; } to{ transform:translate(0,0) rotate(0); opacity:1; } }

  /* Neon Gradient Ring */
  .ring{
    fill:none;
    stroke:url(#neonGrad);
    stroke-width:10;
    stroke-linecap:round;
    stroke-dasharray: var(--circ);
    stroke-dashoffset: var(--circ);
    opacity:0;
    filter:drop-shadow(0 0 8px var(--accent-glow));
    transform-box:fill-box;
    transform-origin:center;
    animation: ringClose 1s cubic-bezier(.32,1.5,.55,1) 1.15s forwards;
  }
  @keyframes ringClose{
    0%   { stroke-dashoffset:var(--circ); opacity:0; transform:scale(.82) rotate(-90deg); }
    55%  { opacity:1; }
    100% { stroke-dashoffset:0; opacity:1; transform:scale(1) rotate(-90deg); }
  }

  .brand{
    margin-top:clamp(20px,4vh,34px);
    text-align:center;
    position:relative;
  }

  .brand-text{
    margin:0;
    display:flex;
    justify-content:center;
    font-size:clamp(26px,4.4vw,40px);
    font-weight:700;
    letter-spacing:0.04em;
    color: var(--white); /* Pure White as requested */
    position:relative;
    overflow:hidden;
  }

  .brand-text span{
    display:inline-block;
    opacity:0;
    transform:translateY(16px);
    animation: letterUp 0.55s ease-out forwards;
    animation-delay: calc(2.15s + (var(--i) * 0.045s));
  }
  
  @keyframes letterUp{ to{ opacity:1; transform:translateY(0); } }

  .brand-underline{
    height:2px;
    width:0;
    margin:10px auto 0;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow:0 0 10px var(--accent-glow);
    animation: underlineDraw 0.7s ease-out 2.55s forwards;
  }
  @keyframes underlineDraw{ to{ width:min(38vmin,190px); } }

  /* Dimmed Glow Animations */
  @keyframes glowBloom{ to{ opacity:0.5; transform:translate(-50%,-50%) scale(1); } }
  @keyframes glowBreathe{ 0%,100%{ opacity:0.4; } 50%{ opacity:0.2; } }

  @media (prefers-reduced-motion: reduce){
    .card, .ring, .brand-text span, .brand-underline, .ambient-glow {
      animation-duration:0.01s !important;
      animation-delay:0s !important;
      transform:none !important;
      opacity:1 !important;
      stroke-dashoffset:0 !important;
      width:min(38vmin,190px) !important;
    }
  }
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="ambient-glow"></div>

  <div class="icon-stage">
    <svg class="icon-svg" viewBox="0 0 400 400">
      <defs>
        <!-- Glass Gradient for Cards -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
        </linearGradient>
        
        <!-- Neon Gradient for Ring -->
        <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#7c5cff"/>
        </linearGradient>
      </defs>

      <circle class="ring" cx="200" cy="200" r="155"/>
      
      <rect class="card card-tl" x="108" y="108" width="84" height="84" rx="18"/>
      <rect class="card card-tr" x="208" y="108" width="84" height="84" rx="18"/>
      <rect class="card card-bl" x="108" y="208" width="84" height="84" rx="18"/>
      <rect class="card card-br" x="208" y="208" width="84" height="84" rx="18"/>
    </svg>
  </div>

  <div class="brand">
    <h1 class="brand-text" id="brandText"></h1>
    <div class="brand-underline"></div>
  </div>
</div>

<script>
  // Build the "VibeGrid" letters
  (function(){
    var word = "VibeGrid";
    var el = document.getElementById('brandText');
    word.split('').forEach(function(ch, i){
      var span = document.createElement('span');
      span.textContent = ch;
      span.style.setProperty('--i', i);
      el.appendChild(span);
    });
  })();

  // Desktop shell hook
  window.VibeGridSplash = {
    finish: function(callback){
      var splash = document.getElementById('splash');
      splash.style.transition = 'opacity 0.5s ease';
      splash.style.opacity = '0';
      setTimeout(function(){
        splash.style.display = 'none';
        if (typeof callback === 'function') callback();
      }, 500);
    }
  };
</script>

</body>
</html>
