[package]
name = "vibegrid"
version = "0.1.0"
description = "VibeGrid - Free, open-source GPU-accelerated terminal workspace"
authors = ["VibeGrid Open Source Community"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
lazy_static = "1.4"
dirs = "5.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
sysinfo = "0.39.6"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
whisper-rs = "0.16.0"
cpal = "0.18.1"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
