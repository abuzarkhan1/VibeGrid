[package]
name = "vibegrid"
version = "0.1.0"
description = "VibeGrid - Free, open-source GPU-accelerated terminal workspace"
authors = ["Abuzar Khan <abuzarkhan1242@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
tokio = { version = "1", features = ["net", "time", "rt", "macros", "sync", "fs", "io-util", "process", "signal"] }
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
dirs = "5.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
axum = "0.8.9"
reqwest = { version = "0.13.4", features = ["blocking"] }
whisper-rs = "0.16.0"
cpal = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
# Audit: the "test" feature ships tauri::test (mock runtime) — it must NOT
# be in the main dependency, or the mock-runtime module compiles into release
# builds. Features from dev-dependencies unify only for test/bench targets.
tauri = { version = "2.0.0", features = ["test"] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true
