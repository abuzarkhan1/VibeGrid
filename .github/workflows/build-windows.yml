name: Build Windows

# Manual trigger — produces the VibeGrid_0.1.0_x64-setup.exe artifact for
# uploading to the GitHub release. Windows binaries cannot be cross-built on
# macOS, so this runs on a native windows-latest runner.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # whisper-rs compiles whisper.cpp, which needs CMake + a C++ compiler
      # (audit: the Windows release build previously had no CMake step and
      # would fail at the whisper-rs-sys build stage). windows-latest ships
      # VS Build Tools, but CMake is not guaranteed — install it explicitly.
      # (macOS runners ship CMake preinstalled, which is why this step is
      # Windows-only in release.yml too.)
      - name: Install CMake
        uses: lukka/get-cmake@v0.6.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vibegrid-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
