name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest Frontend Unit Tests
        run: npm test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri (wry) + whisper-rs (whisper.cpp) need system libraries to
      # COMPILE on Linux. Without these, `cargo clippy`/`cargo test` fail at
      # pkg-config (webkit2gtk-4.1) or CMake (whisper). Canonical dep set from
      # the Tauri v2 docs. NOTE: only libayatana-appindicator3-dev — the old
      # libappindicator3-dev was REMOVED from Ubuntu 24.04 (ubuntu-latest),
      # and ayatana provides the tray icon on 22.04+.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            cmake

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Audit: the marketing website is part of the repo but was never checked
      # by CI — a broken website could merge silently. Typecheck + build it.
      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck website
        working-directory: website
        run: npx tsc --noEmit

      - name: Build website
        working-directory: website
        run: npm run build
